name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Runs the action exactly as users do, without committing, on small fixtures covering every
  # scene and both output formats.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./
        id: render
        with:
          config: >-
            test/fixtures/smoke-object.json
            test/fixtures/smoke-text.json
            test/fixtures/smoke-orbits.json
            test/fixtures/smoke-contributions.json
            test/fixtures/smoke-apng.json
          output: out
          user: octocat
          commit: 'false'

      - name: Check outputs
        run: |
          for f in smoke-object-dark.gif smoke-object-light.gif smoke-text-dark.gif smoke-orbits-light.gif \
                   smoke-contributions-dark.gif smoke-apng-dark.png; do
            test -s "out/$f" || { echo "::error::missing out/$f"; exit 1; }
          done
          test "${{ steps.render.outputs.changed }}" = "true"

      - uses: actions/upload-artifact@v7
        with:
          name: smoke-renders
          path: out/
